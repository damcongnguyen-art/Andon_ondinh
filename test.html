            <div class="col-md-3" style="height: 100%;">
                <div class="boxShawBottom ">
                    <div>
                        <div style="text-align:center;">
                            <p tkey="lbl_TIME_STATUS" style="font-size: 3vh; font-weight: 700; color: #ff0000 ">CHI TIẾT THỜI GIAN CHẠY:</p>
                            <div id="TimeStatus" class="col-md-12" style="height: 100%; align-content:center "></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3" style="height: 100%;">
                <div class="boxShawBottom" style="margin-right:-2.1vh">
                    <div style="text-align:center;">
                        <p tkey="lbl_STOP_TIME" style="font-size: 3vh; font-weight: 700; color: #ff0000 ">CHI TIẾT THỜI GIAN DỪNG:</p>
                        <div id="StopTime" class="col-md-12" style="height: 100%; align-content:center "></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Nhập thông tin mật khẩu</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger" role="alert" style="display: none">
                        <p id="alertMess"></p>
                    </div>
                    <form>
                        <div class="form-group">
                            <input type="password" class="form-control" id="Pass" placeholder="Nhập password">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Đóng</button>
                    <button type="button" id="btnLoadData" class="btn btn-primary">Đăng nhập</button>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="d-none">
    <label id="lbl_Code" tkey="lbl_Code" class="d-none">90</label>
    <label id="lbl_line" tkey="lbl_line" class="d-none">90</label>
    <label id="lbl_TimeLap" tkey="lbl_TimeLap" class="d-none">15</label>
    <label id="ERROR_PASS" tkey="LBL_REPORT_TANK_LastDay" class="d-none">Sai mật khẩu mời bạn nhập lại</label>
    <label id="CHECK_PASS" tkey="LBL_CHECK_PASS" class="d-none">true</label>
</div>

<script type="text/javascript">
    var model = kendo.observable({
        checkPass: true,
        password: "",
        listValve: [],
        checkStatus: 0,
        minCount: 1,
        status_color: ""
    });
    $("#img").click(function () {
        const pageKV1 = document.querySelector("#page");
        const rfs = pageKV1.requestFullscreen || pageKV1.webkitRequestFullScreen || pageKV1.mozRequestFullScreen || pageKV1.msRequestFullscreen;
        rfs.call(pageKV1);
    });
    let LineId = $.fn.Request("LineId");
    const loadData = (isEmpty) => {
        var pass = $("#Pass").val();
        $.post("/Mes_Msg_Statistic/Load_Msg_Line",
            {
                LineId: LineId,
                checkPass: false,
                password: pass,
            }
        ).done(function (result) {
            let rs = null;
            try { rs = JSON.parse(result); } catch (ex) { }
            if (rs !== null && rs !== undefined) {
                if (rs.ID === 0) {
                    model.set("checkPass", false);
                    localStorage.setItem('checkLogin', true);
                    $('#exampleModal').modal('hide');
                    var rsss = rs.DATA;
                    tblLine(rsss.MES_MSG_LINE);
                    tblLineProduct(rsss.MES_MSG_LINE_DETAIL);
                    tblLineStop(rsss.MES_MSG_LINE_WORKING);
                } else {
                    var message = `${$(`#${rs.EXCEPTION_MESSAGE}`)[0].innerHTML}`;
                    $(".alert").show();
                    setTimeout(function () {
                        $(".alert").hide();
                    }, 10000);
                    alertMess.innerHTML = message;
                }


            }
        }).fail(function () { });
    }
    function convertIntoMony(numberInput) {
        const numberValue = parseFloat(numberInput); // Get the number value from the input

        // Format the number as VND using toLocaleString()
        const formattedNumber = numberValue.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' });
        const numberWithoutSymbol = formattedNumber.replace('₫', '');

        return numberWithoutSymbol;
    }

    function tblLine(dt) {
        var item = dt[0];
        const svgUpArrow = '<svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 8l-6 6h12l-6-6z"/></svg>';
        const svgDownArrow = '<svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M12 16l-6-6h12l-6 6z"/></svg>';

        $("#tlLine").html(item.LINE_NAME);
        $("#tlProductCode").html(item.PRODUCT_CODE);
        $("#lbl_ProductName").html(item.PRODUCT_NAME);
        $("#statusText").html(item.statusText);
        $("#lbl_HEADCOUNT").val(convertIntoMony(item.HEAD_COUNT));
        $("#lbl_TAKTTIME").val(convertIntoMony(item.TAKT_TIME));
        $("#lbl_CURRENT_PLAN").val(convertIntoMony(item.PLAN_QUANTITY));
        $("#lbl_TARGET").val(convertIntoMony(item.TARGET_QUANTITY));
        $("#lbl_ACTUAL").val(convertIntoMony(item.ACTUAL_QUANTITY));
        $("#lbl_DELTA").val(convertIntoMony(item.DELTA));
        $("#icon_Delta").html("");

        document.title = `iAndon - Smart Production Monitoring`; // TOTA - Công Nghệ Khí Hóa Sinh Khối
        //setFavicon("../Graphics/Avani/logo_mini.png");

        if (convertIntoMony(item.DELTA) < 0) {
            $("#icon_Delta").html(svgDownArrow);  // Display up arrow SVG
            $("#lbl_DELTA").css({
                "background-color": "#ff0000",
            });
        } else if (parseFloat(item.DELTA) > 0) {
            $("#icon_Delta").html(svgUpArrow);  // Display down arrow SVG
            $("#lbl_DELTA").css({
                "background-color": "#008000",
            });
        } else {
            $("#icon_Delta").html(svgUpArrow);  // Default to down arrow SVG for zero
            $("#lbl_DELTA").css({
                "background-color": "#012060",
            });
        }


        drawEfficiency(item.TARGET_RATE, item.TOTAL_TARGET_RATE);
        $("#statusText").text(item.EVENTDEF_NAME_VN);
        $("#statusValve").css({ "background-color": item.EVENTDEF_COLOR });
        $("#statusText").css({ "color": "#ffffff" });

        if (item.EVENTDEF_ID === "1") {
            if (model.checkStatus !== "1") {
                drawHeaderLine(dt);
            }
            model.set("checkStatus", "1");
        } else if (item.EVENTDEF_ID === "2") {
            $("#statusValve").css({ "width": "100%" });
            model.set("checkStatus", "0");
            if (model.interval) {
                clearInterval(model.interval);
            }
        } else {
            $("#statusValve").css({ "width": "100%" });
            model.set("checkStatus", "0");
            if (model.interval) {
                clearInterval(model.interval);
            }
        }
    }


    function tblLineProduct(dt) {
        var str = "";
        var bg = "";
        for (var i = 0; i < dt.length; i++) {
            var item = dt[i];
            bg = "";
            if (item.STATUS == 2) {
                bg += "background-color: rgb(0, 128, 0);color:white;";
            }
            str += "<tr>";
            str += `<td align="center" style="${bg}">` + formatTime(new Date(Date.parse(item.STARTED))) + '-' + formatTime(new Date(Date.parse(item.FINISHED))) + '</td>';
            str += `<td align="center" style="${bg}">` + item.PRODUCT_CODE + '</td>';
            str += `<td align="center" style="${bg}">` + item.HEAD_COUNT + '</td>';
            str += `<td align="center" style="${bg}">` + item.PLAN_RATE + '%</td>';
            str += `<td align="center" style="${bg}">` + item.TARGET_RATE.toFixed() + '%</td>';
            str += `<td align="center" style="${bg}">` + item.ACTUAL_QUANTITY + '/' + item.PLAN_QUANTITY + '</td>';
            str += `<td align="center" style="${bg}">` + item.STATUS_NAME + '</td>';
            str += "</tr>";
        }
        $("tbody").html(str);
    }
    function formatTime(dateObject) {
        const hours = String(dateObject.getHours()).padStart(2, '0');
        const minutes = String(dateObject.getMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
    }

    function tblLineStop(dt) {
        var strItem = "";
        $("#StopTime").html("");
        let stop = dt.filter(x => x.EVENTDEF_ID == 2);
        let total_stop = dt.filter(x => x.EVENTDEF_ID == 2 && x.REASON_ID == "");
        for (var i = 0; i < stop.length; i++) {
            var item = stop[i];
            let color = item.EVENTDEF_COLOR;
            if (color == "") {
                color = total_stop[0].EVENTDEF_COLOR;
            }
            if (item.REASON_ID != "") {
                strItem += `<div class="row " style="align-items: center; display: flex; margin-bottom: 0.5vh;">
                                <label class="col-md-5 labelStyle">${item.EVENTDEF_NAME_VN}</label>
                                <div class="col-md-5 ">
                                    <input class="inputStop" disabled value="${convertIntToDateTime(parseInt(item.DURATION) * 1000)}" style="background-color: ${color};color:white;width:100%;"/>
                                </div>
                                </div>
                            `;
            }
            $("#StopTime").html(strItem);
        }
        var strTime = "";
        $("#TimeStatus").html("");
        let time = dt.filter(x => x.REASON_ID == "");
        for (var i = 0; i < time.length; i++) {
            var item = time[i];
            if (Number(item.EVENTDEF_ID) == 0) {
                strTime += `<div class="row " style="align-items: center; display: flex;margin-bottom: 0.5vh">
                    <label class="col-md-5 labelStyle">${item.EVENTDEF_NAME_VN}</label>
                    <div class="col-md-5">
                        <input class="inputStop" disabled value="${convertIntToDateTime(parseInt(item.DURATION) * 1000)}" style="background-color: ${item.EVENTDEF_COLOR};width:100%;"/>
                    </div>
                    </div>
                `;
            }
            else {
                strTime += `<div class="row " style="align-items: center; display: flex; margin-bottom: 0.5vh;">
                    <label class="col-md-5 labelStyle">${item.EVENTDEF_NAME_VN}</label>
                    <div class="col-md-5 ">
                        <input class="inputStop" disabled value="${convertIntToDateTime(parseInt(item.DURATION) * 1000)}" style="background-color: ${item.EVENTDEF_COLOR};color:white;width:100%;"/>
                    </div>
                    </div>
                `;
            }
            $("#TimeStatus").html(strTime);
        }
    }
    function convertIntToDateTime(milliseconds) {
        const date = new Date(new Date().setHours(0, 0, 0, milliseconds));
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');

        return `${hours}:${minutes}:${seconds}`;
    }

    function drawEfficiency(code, lines) {
        let lbl_code = $("#lbl_Code").text();
        var rangesCode = "";
        if (parseInt(code) < parseInt(lbl_code)) {
            rangesCode = [{
                from: 0,
                to: parseInt(code),
                color: "#ff3030"
            }]
        } else if (parseInt(code) >= parseInt(lbl_code) && parseInt(code) < 97) {
            rangesCode = [{
                from: 0,
                to: parseInt(code),
                color: "#fabe4d"
            }]
        }
        else if (parseInt(code) >= 97) {
            rangesCode = [{
                from: 0,
                to: parseInt(code),
                color: "#19ff7d"
            }]
        }
        $("#valCode").text(`${Number(code).toFixed()}%`);
        $("#gaugeCode").kendoRadialGauge({
            pointer: [],
            scale: {
                rangeSize: 35,//To configure the width of range
                startAngle: 90,
                endAngle: 450,
                max: 100,
                labels: { visible: false },
                majorTicks: { visible: false },
                minorTicks: { visible: false },
                ranges: rangesCode
            },
        });
        let lbl_line = $("#lbl_line").text();
        var rangesLine = "";
        if (parseInt(lines) < parseInt(lbl_line)) {
            rangesLine = [{
                from: 0,
                to: parseInt(lines),
                color: "#ff3030"
            }]
        } else if (parseInt(lines) >= parseInt(lbl_line) && parseInt(lines) < 97) {
            rangesLine = [{
                from: 0,
                to: parseInt(lines),
                color: "#fabe4d"
            }]
        }
        else if (parseInt(lines) >= 97) {
            rangesLine = [{
                from: 0,
                to: parseInt(lines),
                color: "#19ff7d"
            }]
        }
        $("#valLine").text(`${Number(lines).toFixed()}%`);
        $("#gaugeLine").kendoRadialGauge({
            pointer: [],
            scale: {
                rangeSize: 35,//To configure the width of range
                startAngle: 90,
                endAngle: 450,
                max: 100,
                labels: { visible: false },
                majorTicks: { visible: false },
                minorTicks: { visible: false },
                ranges: rangesLine
            },
        });
    }

    var interval = null;
    function drawHeaderLine(dt) {
        if (dt) {
            var item = dt[0];
            const timeElement = document.getElementById('statusValve');
            var currentTime = parseInt(item.TAKT_TIME) != 0 ? parseInt(item.TAKT_TIME) : 20; // Thời gian bắt đầu (tính bằng giây)
            let count = 100 / currentTime;
            $("#statusText").text(item.EVENTDEF_NAME_VN);
            $("#statusValve").css({ "background-color": item.EVENTDEF_COLOR, });
            interval = setInterval(() => {
                currentTime--;
                model.set("minCount", currentTime);
                var width = currentTime * count; // Tính toán chiều rộng thanh màu sắc
                timeElement.style.width = width + '%';

                if (model.minCount == 0) {
                    currentTime = parseInt(item.TAKT_TIME);
                    width = currentTime * count;
                    timeElement.style.width = width + '%';
                    model.set("minCount", 1);
                }
            }, 1000);
            model.set("interval", interval);
        }
    }

    $(document).ready(() => {

        drawHeaderLine(null);
        //if (localStorage.checkLogin) {
        //    model.set("checkPass", false);
        //    loadData(true);
        //} else {
        //    $('#exampleModal').modal('show');
        //    $("#btnLoadData").click(function () {
        //        loadData(true);
        //    });
        //}

        loadData();
        setInterval(function () {
            // Lấy ngày hiện tại
            var dateNow = new Date();
            lbl_TimeNow.innerHTML = dateNow.toLocaleTimeString('en-GB', { hour: "numeric", minute: "numeric", second: "numeric" });
            lbl_DateNow.innerHTML = dateNow.toLocaleDateString('en-GB');
        }, 1000);

        setInterval(function () {
            loadData();
        }, 3000);
        function setFavicon(iconPath) {
            // Find the existing favicon element
            let favicon = document.querySelector("link[rel~='icon']");

            // If no favicon exists, create one
            if (!favicon) {
                favicon = document.createElement("link");
                favicon.rel = "icon";
                document.head.appendChild(favicon);
            }

            // Set the new favicon path
            favicon.href = iconPath;
        }

        // Example usage
        setFavicon("../Graphics/Avani/logo_mini.png");
    })
</script>
            </section>
        </div>
    </div>
    <span id="popupNotification"></span>
    <script src="/libs/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
